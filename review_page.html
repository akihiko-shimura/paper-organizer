<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>候補の確認</title>
<style>
:root {
  --bg: #f6f5f2; --card: #ffffff; --ink: #1d1d1b; --mute: #6b6a66; --line: #e2e0da;
  --y: #1f7a4d; --y-bg: #e3f3ea; --n: #a33a2c; --n-bg: #f8e6e3; --focus: #2f5fd0;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171716; --card: #222220; --ink: #ecebe6; --mute: #a3a29c; --line: #34332f;
    --y: #6fcf9b; --y-bg: #1d3328; --n: #f08a7a; --n-bg: #3a2320; --focus: #8aa8ff;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.55 -apple-system, "Hiragino Sans", "Helvetica Neue", sans-serif; }
header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line);
  padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
header h1 { font-size: 16px; margin: 0; font-weight: 600; }
.count { color: var(--mute); font-variant-numeric: tabular-nums; }
.bar { flex: 1 1 160px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; min-width: 120px; }
.bar i { display: block; height: 100%; background: var(--y); width: 0; }
button, select { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink);
  border-radius: 6px; padding: 5px 12px; cursor: pointer; }
button.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
main { max-width: 900px; margin: 0 auto; padding: 16px; }
.help { color: var(--mute); font-size: 13px; margin: 0 0 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin: 0 0 10px;
  scroll-margin-top: 80px; }
.card.cur { outline: 2px solid var(--focus); outline-offset: 1px; }
.card.y { border-left: 5px solid var(--y); }
.card.n { border-left: 5px solid var(--n); }
.card.m { border-left: 5px dashed var(--y); }
.card.x { border-left: 5px solid var(--mute); opacity: .75; }
.meta { color: var(--mute); font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 12px; overflow-wrap: anywhere; }
.row { display: grid; grid-template-columns: 5.5em 1fr; gap: 2px 10px; margin-top: 8px; }
.row .k { color: var(--mute); font-size: 12px; padding-top: 2px; }
.row .v { overflow-wrap: anywhere; }
.pick { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.pick button.on-y { background: var(--y-bg); border-color: var(--y); color: var(--y); font-weight: 600; }
.pick button.on-n { background: var(--n-bg); border-color: var(--n); color: var(--n); font-weight: 600; }
.pick button.on-m { background: var(--y-bg); border-color: var(--y); color: var(--y); font-weight: 600; }
.pick button.on-x { background: var(--line); border-color: var(--mute); color: var(--ink); font-weight: 600; }
a { color: var(--focus); }
kbd { font: 12px ui-monospace, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
</style>
</head>
<body>
<header>
  <h1>候補の確認</h1>
  <span class="count" id="count"></span>
  <div class="bar"><i id="bar"></i></div>
  <select id="filter" aria-label="表示">
    <option value="all">すべて</option>
    <option value="todo">未判定だけ</option>
    <option value="done">判定済みだけ</option>
  </select>
  <button class="primary" id="export">書き出す</button>
</header>
<main>
  <p class="help"><kbd>y</kbd> 正しい ・ <kbd>m</kbd> 正しい（出版前の原稿） ・ <kbd>n</kbd> 候補が違う ・
    <kbd>x</kbd> 論文ではない（本の抜粋・講義ノート・資料） ・ <kbd>u</kbd> 取り消し ・ <kbd>j</kbd>/<kbd>k</kbd> 次・前 ・
    <kbd>o</kbd> PDF を開く。判定はこのブラウザに保存される。終わったら「書き出す」で review-ok.tsv を保存し、
    <code>python3 organize.py review-ok ~/Downloads/review-ok.tsv</code></p>
  <div id="list"></div>
</main>
<script id="data" type="application/json">__DATA__</script>
<script>
"use strict";
const ROWS = JSON.parse(document.getElementById("data").textContent);
const KEY = "paper-organizer-review:" + (ROWS.length ? ROWS[0].stamp : "");
let picks = {};
try { picks = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { picks = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(picks)); } catch (e) {} };
const id = r => r.path + "\t" + r.cand_doi;
let cur = 0;

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function row(k, v) {
  const d = el("div", "row"); d.append(el("div", "k", k));
  const c = el("div", "v"); if (v instanceof Node) c.append(v); else c.textContent = v || "—";
  d.append(c); return d;
}
function fileURL(p) { return "file://" + p.split("/").map(encodeURIComponent).join("/"); }

function render() {
  const list = document.getElementById("list"); list.textContent = "";
  const f = document.getElementById("filter").value;
  ROWS.forEach((r, i) => {
    const p = picks[id(r)];
    if ((f === "todo" && p) || (f === "done" && !p)) return;
    const c = el("section", "card" + (p ? " " + p : "") + (i === cur ? " cur" : ""));
    c.id = "c" + i;
    const m = el("div", "meta");
    m.append(el("span", null, "#" + (i + 1)), el("span", null, r.reason), el("span", null, r.folder));
    c.append(m);
    c.append(row("ページ", r.hint));
    const pdf = el("a", null, r.file); pdf.href = fileURL(r.path); pdf.target = "_blank";
    c.append(row("ファイル", pdf));
    c.append(row("候補", r.cand_title));
    c.append(row("誌・年", [r.cand_where, r.cand_year].filter(Boolean).join(" ・ ")));
    const doi = el("a", null, r.cand_doi); doi.href = "https://doi.org/" + encodeURI(r.cand_doi); doi.target = "_blank";
    doi.rel = "noopener";
    c.append(row("DOI", doi));
    const pk = el("div", "pick");
    const by = el("button", p === "y" ? "on-y" : "", "y 正しい"), bn = el("button", p === "n" ? "on-n" : "", "n 候補が違う");
    const bm = el("button", p === "m" ? "on-m" : "", "m 正しい（原稿）"), bx = el("button", p === "x" ? "on-x" : "", "x 論文ではない");
    by.onclick = () => { set(i, "y"); }; bn.onclick = () => { set(i, "n"); };
    bm.onclick = () => { set(i, "m"); }; bx.onclick = () => { set(i, "x"); };
    pk.append(by, bm, bn, bx);
    if (p) { const bu = el("button", null, "取り消し"); bu.onclick = () => set(i, null); pk.append(bu); }
    c.append(pk);
    c.onclick = e => { if (e.target.tagName !== "BUTTON" && e.target.tagName !== "A") { cur = i; mark(); } };
    list.append(c);
  });
  const done = ROWS.filter(r => picks[id(r)]).length;
  document.getElementById("count").textContent =
    done + " / " + ROWS.length + " 判定済み（" + ["y", "m", "n", "x"].map(k =>
      k + " " + ROWS.filter(r => picks[id(r)] === k).length).join(" ・ ") + "）";
  document.getElementById("bar").style.width = (ROWS.length ? 100 * done / ROWS.length : 0) + "%";
}
function mark() {
  document.querySelectorAll(".card.cur").forEach(e => e.classList.remove("cur"));
  const c = document.getElementById("c" + cur);
  if (c) { c.classList.add("cur"); c.scrollIntoView({ block: "nearest" }); }
}
function set(i, v) {
  if (v) picks[id(ROWS[i])] = v; else delete picks[id(ROWS[i])];
  save(); cur = i; render(); mark();
}
function step(d) {
  const f = document.getElementById("filter").value;
  let i = cur;
  do { i += d; } while (i >= 0 && i < ROWS.length && !document.getElementById("c" + i));
  if (i >= 0 && i < ROWS.length) { cur = i; mark(); }
}
function exportText() {
  const lines = ["path\tcand_doi\tok"];
  ROWS.forEach(r => { const p = picks[id(r)]; if (p) lines.push([r.path, r.cand_doi, p].join("\t")); });
  return lines.join("\n") + "\n";
}
document.getElementById("export").onclick = () => {
  const a = el("a"); a.download = "review-ok.tsv";
  a.href = URL.createObjectURL(new Blob([exportText()], { type: "text/tab-separated-values" }));
  document.body.append(a); a.click(); a.remove();
};
document.getElementById("filter").onchange = () => { render(); mark(); };
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.target.tagName === "SELECT") return;
  if ("ymnx".includes(e.key) && e.key.length === 1) { set(cur, e.key); step(1); }
  else if (e.key === "u") set(cur, null);
  else if (e.key === "j") step(1);
  else if (e.key === "k") step(-1);
  else if (e.key === "o") window.open(fileURL(ROWS[cur].path), "_blank");
  else return;
  e.preventDefault();
});
render(); mark();
</script>
</body>
</html>
